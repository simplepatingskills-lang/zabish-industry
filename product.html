<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030914">
<title>Product Details | Zabish Industry</title>
<meta name="description" content="Explore product details from Zabish Industry.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:dark;
  --bg:#030914;
  --panel:#0b1628;
  --panel2:#101f35;
  --text:#f4f8ff;
  --muted:#9eb0c8;
  --blue:#38bdf8;
  --blue2:#2563eb;
  --line:rgba(148,183,220,.18)
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top right,rgba(37,99,235,.18),transparent 42%),var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  min-height:100vh
}
a{color:inherit}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:20px clamp(18px,5vw,72px);
  border-bottom:1px solid var(--line);
  background:rgba(3,9,20,.8)
}
.brand{font-weight:800;letter-spacing:2px;text-decoration:none}
.brand small{
  display:block;font-size:10px;letter-spacing:4px;color:var(--blue);margin-top:4px
}
.back{color:var(--blue);text-decoration:none;font-size:14px}
.wrap{width:min(1120px,92%);margin:48px auto}
.crumb{font-size:13px;color:var(--muted);margin-bottom:24px}
.product-layout{
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  gap:clamp(28px,5vw,64px);
  align-items:start
}
.photo-panel,.info-panel{
  background:linear-gradient(145deg,rgba(16,31,53,.96),rgba(7,15,29,.96));
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden
}
.photo-panel{padding:20px;position:sticky;top:20px}
.photo-panel img{
  width:100%;aspect-ratio:1/1;object-fit:contain;display:block;
  border-radius:14px;background:rgba(255,255,255,.025)
}
.info-panel{padding:clamp(24px,4vw,42px)}
.eyebrow{
  font-size:12px;letter-spacing:2px;color:var(--blue);
  font-weight:700;text-transform:uppercase
}
.title{font-size:clamp(28px,4vw,42px);line-height:1.12;margin:14px 0}
.meta{color:var(--muted);font-size:14px}
.rating{color:#fbbf24;letter-spacing:2px;margin:18px 0}
.price-line{display:flex;align-items:center;gap:12px;margin:18px 0 22px}
.price{font-size:30px;font-weight:800}
.old{color:#7f91a9;text-decoration:line-through}
.desc{line-height:1.75;color:#c1cee0}
.features{padding:0;list-style:none;display:grid;gap:10px;margin:22px 0}
.features li{
  padding:12px 14px;background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:10px;color:#dbe8f8;font-size:14px
}
.buyrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{background:transparent;color:white;border:0;padding:12px 15px;cursor:pointer;font-size:18px}
.qty span{min-width:30px;text-align:center}
.btn{
  border:0;border-radius:12px;padding:14px 20px;
  background:linear-gradient(100deg,var(--blue2),#0891b2);
  color:white;font-weight:700;cursor:pointer;flex:1;min-width:150px
}
.btn.secondary{background:transparent;border:1px solid var(--blue);color:var(--blue)}
.notice{color:var(--muted);font-size:12px;line-height:1.6;margin-top:20px}
.status{margin-top:16px;color:#7dd3fc;font-size:14px;min-height:20px}
.missing{
  max-width:650px;margin:70px auto;padding:32px;text-align:center;
  border:1px solid var(--line);border-radius:20px;background:var(--panel)
}
.missing a{color:var(--blue)}
footer{
  text-align:center;color:var(--muted);font-size:12px;
  padding:28px;border-top:1px solid var(--line)
}
@media(max-width:760px){
  .product-layout{grid-template-columns:1fr}
  .photo-panel{position:static}
  .wrap{margin:28px auto}
  .topbar{padding:16px}
  .info-panel{padding:24px}
}
</style>
</head>

<body>
<header class="topbar">
  <a class="brand" href="index.html">ZABISH<small>INDUSTRY</small></a>
  <a class="back" href="index.html">← Continue shopping</a>
</header>

<main class="wrap">
  <div class="crumb"><a href="index.html">Home</a> / Product details</div>
  <div id="productRoot">
    <div class="missing">Loading product details…</div>
  </div>
</main>

<footer>
  © <span id="year"></span> Zabish Industry · Beauty Tools · Men's Fashion
</footer>

<script>
const params = new URLSearchParams(location.search);
const productId = params.get("id");

const money = n => "$" + (Number(n) || 0).toFixed(2);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

function readJSON(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  } catch (error) {
    return fallback;
  }
}

const catalog = readJSON("zabish_product_catalog", []);
const last = readJSON("zabish_selected_product", null);

const product =
  (Array.isArray(catalog)
    ? catalog.find(p => String(p.id) === String(productId))
    : null)
  || (last && String(last.id) === String(productId) ? last : null);

const root = document.getElementById("productRoot");

if (!product) {
  root.innerHTML = `
    <div class="missing">
      <h1>Product not found</h1>
      <p>Please open the product from the Zabish Industry homepage.</p>
      <a href="index.html">Return to homepage</a>
    </div>`;
} else {
  const image = product.image || product.imageUrl || "";

  const description = product.description || product.details ||
    `Discover ${product.name} from Zabish Industry. Designed with attention to quality, usability and everyday value. Contact us for more product specifications, wholesale enquiries and shipping information.`;

  const material = product.material || product.type || "Quality product";

  const category = product.cat === "beauty"
    ? "Beauty Tools"
    : product.cat === "fashion"
      ? "Men's Fashion"
      : (product.category || "Zabish Collection");

  const specs = Array.isArray(product.specifications)
    ? product.specifications
    : Array.isArray(product.specs)
      ? product.specs
      : [];

  const features = [
    `Category: ${category}`,
    `Material / Type: ${material}`,
    `Product ID: ${product.id}`,
    ...specs.map(item =>
      typeof item === "string"
        ? item
        : (item.label
            ? `${item.label}: ${item.value ?? ""}`
            : JSON.stringify(item))
    )
  ];

  root.innerHTML = `
    <section class="product-layout">
      <div class="photo-panel">
        <img
          id="mainImage"
          src="${esc(image)}"
          alt="${esc(product.name)}"
          onerror="this.style.display='none'"
        >
      </div>

      <div class="info-panel">
        <div class="eyebrow">${esc(category)}</div>

        <h1 class="title">${esc(product.name)}</h1>

        <div class="meta">Product code: ${esc(product.id)}</div>

        <div class="rating" aria-label="Demo rating">
          ★★★★★
          <span class="meta">Customer rating display (demo)</span>
        </div>

        <div class="price-line">
          <span class="price">${money(product.price)}</span>
          ${
            Number(product.old) > Number(product.price)
              ? `<span class="old">${money(product.old)}</span>`
              : ""
          }
        </div>

        <p class="desc">${esc(description)}</p>

        <ul class="features">
          ${features.map(item => `<li>✓ &nbsp; ${esc(item)}</li>`).join("")}
        </ul>

        <div class="buyrow">
          <div class="qty">
            <button type="button" id="minus" aria-label="Decrease quantity">−</button>
            <span id="qty">1</span>
            <button type="button" id="plus" aria-label="Increase quantity">+</button>
          </div>

          <button class="btn secondary" id="addCart">Add to Cart</button>
          <button class="btn" id="buyNow">Buy Now</button>
        </div>

        <div class="status" id="status" role="status"></div>

        <p class="notice">
          Checkout and online payment are not connected yet.
          Buy Now will add this item to your saved cart; a secure
          checkout/payment provider must be set up before real orders can be placed.
        </p>
      </div>
    </section>
  `;

  let quantity = 1;

  const qtyEl = document.getElementById("qty");
  const status = document.getElementById("status");

  document.getElementById("minus").onclick = () => {
    quantity = Math.max(1, quantity - 1);
    qtyEl.textContent = quantity;
  };

  document.getElementById("plus").onclick = () => {
    quantity = Math.min(99, quantity + 1);
    qtyEl.textContent = quantity;
  };

  function addToSavedCart(goToCart) {
    let cart = readJSON("zabish_cart", []);

    if (!Array.isArray(cart)) cart = [];

    const item = cart.find(x => String(x.id) === String(product.id));

    if (item) {
      item.qty = (Number(item.qty) || 0) + quantity;
    } else {
      cart.push({...product, qty:quantity});
    }

    try {
      localStorage.setItem("zabish_cart", JSON.stringify(cart));
      localStorage.setItem("zabish_selected_product", JSON.stringify(product));
    } catch (error) {
      status.textContent = "Could not save cart in this browser.";
      return;
    }

    status.textContent = quantity + " × " + product.name + " added to cart.";

    if (goToCart) {
      try {
        localStorage.setItem("zabish_open_cart", "1");
      } catch (error) {}

      location.href = "index.html#home";
    }
  }

  document.getElementById("addCart").onclick = () => addToSavedCart(false);
  document.getElementById("buyNow").onclick = () => addToSavedCart(true);
}

document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
